<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">تسجيل الدخول</h2>
    
    <div class="mb-4">
      <label for="username" class="block text-gray-600">اسم المستخدم</label>
      <input type="text" id="username" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="أدخل اسم المستخدم" />
    </div>
    
    <button onclick="login()" class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 focus:outline-none">
      تسجيل الدخول
    </button>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value.trim();
      
      // التحقق من أن اسم المستخدم ليس فارغًا
      if (username) {
        localStorage.setItem('username', username); // تخزين اسم المستخدم في localStorage
        window.location.href = 'chat.html'; // توجيه المستخدم إلى صفحة الدردشة
      } else {
        alert("يرجى إدخال اسم المستخدم.");
      }
    }
  </script>

</body>

</html>
